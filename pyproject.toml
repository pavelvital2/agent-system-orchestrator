[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system-orchestrator"
version = "3.7.9"
description = "Filesystem-governed ASO control-plane CLI with read-only diagnostics and explicit confirmed writes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < \"3.11\"",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.22",
]

[project.scripts]
aso = "agent_system_orchestrator_aso.cli:main"

[tool.setuptools.packages.find]
where = ["agent-system/tools/aso"]
include = ["agent_system_orchestrator_aso*"]

[tool.setuptools.package-data]
"agent_system_orchestrator_aso.resources" = [
    "RESOURCE_MANIFEST.json",
    "agent-system/**/*",
]
