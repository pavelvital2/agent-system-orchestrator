name: Stage 1 Governance

on:
  push:
    branches:
      - upgrade/stage-1-executable-controls
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-governance:
    name: Package governance checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show Python version
        run: python3 --version

      - name: ASO package status
        run: python3 agent-system/tools/aso/aso.py status --root . --mode package

      - name: ASO package lint
        run: python3 agent-system/tools/aso/aso.py lint --root . --mode package --strict

      - name: ASO package doctor
        run: python3 agent-system/tools/aso/aso.py doctor --root . --mode package --strict

      - name: Validate design fixture
        run: python3 agent-system/tools/aso/aso.py validate-design agent-system/tests/fixtures/design/valid_design.md --root . --strict

      - name: Validate context pack fixture
        run: python3 agent-system/tools/aso/aso.py validate-context-pack agent-system/tests/fixtures/context_pack/valid_context_pack.json --root . --strict

      - name: ASO unit tests
        run: python3 -m unittest discover -s agent-system/tools/aso/tests

      - name: Package governance tests
        run: python3 -m unittest discover -s agent-system/tests

      - name: Governance smoke tests
        run: ./agent-system/scripts/run_governance_smoke_tests.sh

      - name: Makefile smoke surface
        run: |
          make test
          make smoke
          make doctor
          make lint

      - name: Whitespace diff check
        run: git diff --check
